# Aggiunto da MILKeX Mobile: compila il progetto su GitHub (senza il computer) quando lo chiedi dall'app.
# Il PDF finisce nel ramo milkex-pdf, lo stesso in cui MILKeX sul computer carica i PDF compilati.
# Nel repository unico dei progetti (un ramo p/<nome> per progetto) il PDF va invece nel ramo pdf/<nome>.
name: MILKeX compila
on:
  workflow_dispatch:
    inputs:
      main:
        description: Documento principale
        required: true
        default: main.tex
      engine:
        description: Compilatore (pdflatex, xelatex, lualatex)
        required: false
        default: pdflatex
      by:
        description: Chi ha chiesto la compilazione
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: milkex-pdf-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compila
        id: tex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ inputs.main }}
          work_in_root_file_dir: true
          latexmk_use_xelatex: ${{ inputs.engine == 'xelatex' }}
          latexmk_use_lualatex: ${{ inputs.engine == 'lualatex' }}
          args: -pdf -f -file-line-error -interaction=nonstopmode
      - name: Pubblica il PDF
        if: always()
        env:
          MAIN: ${{ inputs.main }}
          BY: ${{ inputs.by }}
          OUTCOME: ${{ steps.tex.outcome }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
          ENGINE: ${{ inputs.engine }}
        run: |
          N="$(basename "${MAIN%.*}")"; D="$(dirname "$MAIN")"
          mkdir -p /tmp/out
          [ -f "$D/$N.pdf" ] && cp "$D/$N.pdf" /tmp/out/
          [ -f "$D/$N.log" ] && cp "$D/$N.log" /tmp/out/compile.log
          case "$REF" in p/*) PB="pdf/${REF#p/}";; *) PB="milkex-pdf";; esac
          NEW=1
          git fetch -q origin "+refs/heads/$PB:refs/remotes/origin/$PB" 2>/dev/null || true
          # nome del progetto: quello scritto da MILKeX sul computer, se c'è
          OLDNAME="$(git show "origin/$PB:milkex.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name",""))' 2>/dev/null || true)"
          [ -n "$OLDNAME" ] && REPO_NAME="$OLDNAME"
          if [ ! -f "/tmp/out/$N.pdf" ]; then
            NEW=0
            git show "origin/$PB:$N.pdf" > "/tmp/out/$N.pdf" 2>/dev/null || rm -f "/tmp/out/$N.pdf"
          fi
          # il PDF dei riepiloghi lo prepara MILKeX sul computer: si conserva
          SUM=""
          if [ "$N" != "Riepiloghi" ] && git show "origin/$PB:Riepiloghi.pdf" > /tmp/out/Riepiloghi.pdf 2>/dev/null; then SUM="Riepiloghi.pdf"; else rm -f /tmp/out/Riepiloghi.pdf; fi
          export N NEW SUM REPO_NAME
          python3 -c 'import json,os,time; e=os.environ; json.dump({"name":e["REPO_NAME"],"main":e["MAIN"],"pdf":e["N"]+".pdf","compiledAt":time.time(),"by":e.get("BY",""),"source":"github","compiler":e.get("ENGINE") or "pdflatex","ok":e.get("OUTCOME")=="success","newPdf":e["NEW"]=="1",**({"summaries":e["SUM"]} if e.get("SUM") else {})},open("/tmp/out/milkex.json","w"),ensure_ascii=False)'
          cd /tmp/out
          git init -q -b "$PB"
          git add -A
          git -c user.name="MILKeX" -c user.email="milkex@users.noreply.github.com" commit -qm "PDF compilato su GitHub"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$PB"
