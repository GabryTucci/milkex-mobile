# Aggiunto da MILKeX Mobile: compila il progetto su GitHub (senza il computer) quando lo chiedi dall'app.
# Il PDF finisce nel ramo milkex-pdf, lo stesso in cui MILKeX sul computer carica i PDF compilati.
name: MILKeX compila
on:
  workflow_dispatch:
    inputs:
      main:
        description: Documento principale
        required: true
        default: main.tex
      engine:
        description: Compilatore (pdflatex, xelatex, lualatex)
        required: false
        default: pdflatex
      by:
        description: Chi ha chiesto la compilazione
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: milkex-pdf
  cancel-in-progress: true
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compila
        id: tex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ inputs.main }}
          work_in_root_file_dir: true
          latexmk_use_xelatex: ${{ inputs.engine == 'xelatex' }}
          latexmk_use_lualatex: ${{ inputs.engine == 'lualatex' }}
          args: -pdf -f -file-line-error -interaction=nonstopmode
      - name: Pubblica il PDF
        if: always()
        env:
          MAIN: ${{ inputs.main }}
          BY: ${{ inputs.by }}
          OUTCOME: ${{ steps.tex.outcome }}
          REPO_NAME: ${{ github.event.repository.name }}
          ENGINE: ${{ inputs.engine }}
        run: |
          N="$(basename "${MAIN%.*}")"; D="$(dirname "$MAIN")"
          mkdir -p /tmp/out
          [ -f "$D/$N.pdf" ] && cp "$D/$N.pdf" /tmp/out/
          [ -f "$D/$N.log" ] && cp "$D/$N.log" /tmp/out/compile.log
          NEW=1
          if [ ! -f "/tmp/out/$N.pdf" ]; then
            NEW=0
            git fetch -q origin milkex-pdf && git show "origin/milkex-pdf:$N.pdf" > "/tmp/out/$N.pdf" 2>/dev/null || rm -f "/tmp/out/$N.pdf"
          fi
          export N NEW
          python3 -c 'import json,os,time; e=os.environ; json.dump({"name":e["REPO_NAME"],"main":e["MAIN"],"pdf":e["N"]+".pdf","compiledAt":time.time(),"by":e.get("BY",""),"source":"github","compiler":e.get("ENGINE") or "pdflatex","ok":e.get("OUTCOME")=="success","newPdf":e["NEW"]=="1"},open("/tmp/out/milkex.json","w"),ensure_ascii=False)'
          cd /tmp/out
          git init -q -b milkex-pdf
          git add -A
          git -c user.name="MILKeX" -c user.email="milkex@users.noreply.github.com" commit -qm "PDF compilato su GitHub"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" milkex-pdf
